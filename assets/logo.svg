<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 85" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3B958" />
      <stop offset="50%" stop-color="#E5A844" />
      <stop offset="100%" stop-color="#C98826" />
    </linearGradient>
  </defs>

  <!-- Monograma Original Fiel J + A -->
  <g id="monogram" transform="translate(6, 0)">
    <!-- Letra J: Haste diagonal paralela à perna esquerda do A com gancho gracioso na base -->
    <path d="M 47 11 L 22 71 C 19 79, 13 88, 4 86" 
          stroke="url(#goldGrad)" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Letra A: Haste esquerda (fina) -->
    <path d="M 57 11 L 31 88" 
          stroke="url(#goldGrad)" stroke-width="3.6" stroke-linecap="round" fill="none" />
    
    <!-- Letra A: Haste direita (forte) -->
    <path d="M 57 11 L 86 88" 
          stroke="url(#goldGrad)" stroke-width="4.4" stroke-linecap="round" fill="none" />
    
    <!-- Letra A: Barra horizontal -->
    <path d="M 41 57 L 76 57" 
          stroke="url(#goldGrad)" stroke-width="3.2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Tipografia Original "Janeiro Advocacia & Consultoria" -->
  <text x="110" y="38" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="25" font-weight="700" fill="url(#goldGrad)" letter-spacing="0.4">
    Janeiro Advocacia
  </text>
  <text x="110" y="65" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="22" font-weight="600" fill="url(#goldGrad)" letter-spacing="0.4">
    &amp; Consultoria
  </text>
</svg>
